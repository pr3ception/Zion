<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnidirectional 42-State Matrix</title>
<style>
body {
    background:#000;
    color:#fff;
    font-family:monospace;
    margin:0;
    padding:20px;
}
.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    max-width:1000px;
    margin:auto;
}
.panel {
    border:2px solid #ffd700;
    padding:10px;
    position:relative;
}
.title {
    text-align:center;
    color:#ffd700;
    margin-bottom:10px;
    font-weight:bold;
}
.states {
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}
.state {
    border:1px solid #ffd700;
    padding:4px 6px;
}
.lord {
    background:#ffd700;
    color:#000;
    font-weight:bold;
}
.diag {
    pointer-events:none;
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
}
.line {
    position:absolute;
    width:140%;
    height:2px;
    top:50%;
    left:-20%;
    background:linear-gradient(45deg,transparent,#4ecdc4,transparent);
}
.line.b {
    transform:rotate(-45deg);
}
.line.a {
    transform:rotate(45deg);
}
</style>
</head>
<body>
<h1 style="text-align:center">⚡ Omnidirectional 42‑State Matrix ⚡</h1>
<div class="grid">
<div class="panel" id="hOrig">
  <div class="title">Horizontal original</div>
  <div class="states" data-seq="orig"></div>
  <div class="diag"><div class="line a"></div><div class="line b"></div></div>
</div>
<div class="panel" id="vOrig">
  <div class="title">Vertical original</div>
  <div class="states vertical" data-seq="orig"></div>
  <div class="diag"><div class="line a"></div><div class="line b"></div></div>
</div>
<div class="panel" id="hPers">
  <div class="title">Horizontal personas</div>
  <div class="states" data-seq="pers"></div>
  <div class="diag"><div class="line a"></div><div class="line b"></div></div>
</div>
<div class="panel" id="vPers">
  <div class="title">Vertical personas</div>
  <div class="states vertical" data-seq="pers"></div>
  <div class="diag"><div class="line a"></div><div class="line b"></div></div>
</div>
</div>
<script>
const orig=["3","2","1","0","5","b4","n6","inf7","/0","->","L]","<-","0\\","inf7","n6","b4","5","0","1","2","3"];
const pers=["Wah","Pair","Trypl","Quat","Cink","Sixon","Zenof","Ocnyx","Ningst","Thone","LORD","Thone","Ningst","Ocnyx","Zenof","Sixon","Cink","Quat","Trypl","Pair","Wah"];
for(const panel of document.querySelectorAll('[data-seq]')){
  const seq=panel.dataset.seq==='orig'?orig:pers;
  const box=panel;
  seq.forEach(s=>{
    const span=document.createElement('span');
    span.textContent=s;
    span.className='state'+(s==='L]'||s==='LORD'?' lord':'');
    box.appendChild(span);
  });
}
</script>
</body>
</html>
